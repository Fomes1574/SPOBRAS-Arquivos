<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Arquivos SPOBRAS: Compactar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F5FA8}a:hover{color:#17467C}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 960px; background: #F3F3F1; font-family: Inter, system-ui, sans-serif; color: #231F20; font-size: 15px; line-height: 1.45">
<div style="flex: 1 1 232px; background: #231F20">
<dc-import name="Menu" ativo="compactar" hint-size="232px,960px"></dc-import>
</div>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 40px; display: flex; flex-direction: column; gap: 20px">
<div>
<h1 style="margin: 0; font-size: 30px; font-weight: 700">Compactar</h1>
<p style="margin: 4px 0 0; color: #5A5A5F">Cria vários arquivos .zip de uma vez e também descompacta vários.</p>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
<section style="flex: 1 1 320px; min-width: 0; background: #FFFFFF; border: 1px solid #D6D6D2; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0 0 6px; font-size: 18px">Como compactar</h2>
<label style="display: flex; align-items: flex-start; gap: 10px; min-height: 44px; padding: 8px 0">
<input type="radio" name="modo" checked style="width: 20px; height: 20px; margin-top: 2px">
<span><span style="font-weight: 700; display: block">Um zip para cada pasta</span><span style="color: #5A5A5F">Cada pasta vira um .zip com o mesmo nome.</span></span>
</label>
<label style="display: flex; align-items: flex-start; gap: 10px; min-height: 44px; padding: 8px 0">
<input type="radio" name="modo" style="width: 20px; height: 20px; margin-top: 2px">
<span><span style="font-weight: 700; display: block">Tudo num zip só</span><span style="color: #5A5A5F">Junta os arquivos escolhidos num único .zip.</span></span>
</label>
<label style="display: flex; align-items: flex-start; gap: 10px; min-height: 44px; padding: 8px 0">
<input type="radio" name="modo" style="width: 20px; height: 20px; margin-top: 2px">
<span><span style="font-weight: 700; display: block">Dividir em partes</span><span style="color: #5A5A5F">Para caber no limite do e-mail ou do WhatsApp.</span></span>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; margin-top: 6px">Tamanho máximo de cada parte
<select style="height: 44px; box-sizing: border-box; width: 100%; padding: 0 12px; border: 1px solid #8A8A8E; border-radius: 8px; font: 400 15px Inter, system-ui, sans-serif; color: #231F20; background: #FFFFFF">
<option>Você escolhe o limite (em MB)</option>
</select>
</label>
<label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 500">
<input type="checkbox" style="width: 20px; height: 20px">
Reduzir as fotos antes de compactar
</label>
</section>

<section style="flex: 2 1 420px; min-width: 0; background: #FFFFFF; border: 1px solid #D6D6D2; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 8px">
<h2 style="margin: 0; font-size: 18px">O que vai ser compactado</h2>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<button type="button" style="height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid #231F20; background: #FFFFFF; color: #231F20; font: 600 15px Inter, system-ui, sans-serif; cursor: pointer">Adicionar pastas</button>
<button type="button" style="height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid #231F20; background: #FFFFFF; color: #231F20; font: 600 15px Inter, system-ui, sans-serif; cursor: pointer">Adicionar arquivos</button>
</div>
</div>
<div style="display: grid; grid-template-columns: 1fr 28px 1fr; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid #E6E6E3">
<span style="overflow-wrap: anywhere">Pasta “Pautas”</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A5A5F" stroke-width="2" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
<span style="font-weight: 700; overflow-wrap: anywhere">Pautas.zip</span>
</div>
<div style="display: grid; grid-template-columns: 1fr 28px 1fr; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid #E6E6E3">
<span style="overflow-wrap: anywhere">Pasta “Empenhos”</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A5A5F" stroke-width="2" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
<span style="font-weight: 700; overflow-wrap: anywhere">Empenhos.zip</span>
</div>
<div style="display: grid; grid-template-columns: 1fr 28px 1fr; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid #E6E6E3">
<span style="overflow-wrap: anywhere">Pasta “Fotos [Nome da escola]”</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A5A5F" stroke-width="2" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
<span style="font-weight: 700; overflow-wrap: anywhere">Fotos [Nome da escola].zip</span>
</div>
<div style="margin-top: 12px; padding: 16px; border: 1px dashed #8A8A8E; border-radius: 8px; color: #5A5A5F; text-align: center">Arraste pastas ou arquivos para cá</div>
</section>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #D6D6D2; border-radius: 10px; padding: 14px 18px">
<div style="flex: 1 1 320px; min-width: 0">
<div style="font-size: 13px; color: #5A5A5F">Salvar em</div>
<div style="font-weight: 600; overflow-wrap: anywhere">C:\Users\<usuario>\Downloads</div>
</div>
<button type="button" style="height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid #231F20; background: #FFFFFF; color: #231F20; font: 600 15px Inter, system-ui, sans-serif; cursor: pointer">Escolher outra pasta</button>
<button type="button" style="height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid #231F20; background: #FFFFFF; color: #231F20; font: 600 15px Inter, system-ui, sans-serif; cursor: pointer">Descompactar vários…</button>
<button type="button" style="height: 44px; padding: 0 22px; border-radius: 8px; border: 0; background: #C8102E; color: #FFFFFF; font: 600 15px Inter, system-ui, sans-serif; cursor: pointer">Criar 3 arquivos .zip</button>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":960}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
